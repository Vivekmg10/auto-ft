experiment:
  id: "customer-support-qwen1.5b-v1"
  use_case: >
    Finetune Qwen2.5 1.5B to handle customer support conversations.
    The model should be empathetic, resolve issues efficiently,
    and gracefully decline out of scope requests.Dont run benchmarks for now. just train and we'll  see from there 

dataset:
  path: "./data/customer_support.jsonl"
  format: "sharegpt"

base_model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: true

training:
  mode: "qlora"
  max_runs: 3
  budget_hours: 12

hyperparameter_space:
  learning_rate:
    min: 1e-4
    max: 5e-4
  lora_rank:
    values: [8, 16]
  lora_alpha:
    values: [16, 32]
  batch_size:
    values: [2, 4]
  gradient_accumulation:
    values: [8, 16]
  warmup_ratio:
    min: 0.03
    max: 0.1
  epochs:
    min: 2
    max: 3
  scheduler:
    values: ["cosine", "linear"]

eval:
  benchmark: "auto"
  primary_metric: "conversation_quality"
  eval_every_n_steps: 100
  judge_model: "deepseek/deepseek-v4-flash"

agents:
  strategist: "deepseek/deepseek-v4-pro"
  data_agent: "deepseek/deepseek-v4-flash"
  monitor: "deepseek/deepseek-v4-flash"
  evaluator: "deepseek/deepseek-v4-flash"

storage:
  base_path: "./experiments"
  save_top_k_checkpoints: 1

early_stopping:
  enabled: true
  patience_steps: 200
  min_improvement: 0.01